<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estante">
<title>Minha Estante — Jogos e Livros</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322e4ff'/%3E%3Cpath d='M16 14h10v36H16zM29 14h8v36h-8zM40 17l7-2 8 33-7 2z' fill='%2307080f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =========================================================
   TEMA — variáveis de cor (escuro é o padrão)
   Visual "modo jogador": fundo espacial, néon ciano (ação),
   magenta (XP/recompensa), roxo (platina), verde (livros).
   ========================================================= */
:root{
  --bg:#07080f; --bg2:#0d0f1a; --card:#11131f; --card2:#1a1d2e; --borda:#272b42;
  --txt:#eef1fa; --txt2:#9aa3be; --txt3:#8089a6;
  --pri:#22e4ff; --pri-txt:#07080f; --roxo:#b07cff; --magenta:#ff2e88; --ouro:#ffc53d;
  --ok:#3dffa2; --aviso:#ffc53d; --perigo:#ff5468; --laranja:#ff9a3d;
  --brilho:0 0 18px rgba(34,228,255,.40); --brilho-ok:0 0 14px rgba(61,255,162,.35);
  --grade:rgba(34,228,255,.035);
  --raio:14px; --sombra:0 12px 34px rgba(0,0,0,.55);
  --nav-h:68px; --lado:0px;
  --fonte:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fonte-d:"Chakra Petch",Inter,system-ui,sans-serif;
  color-scheme:dark;
}
[data-tema="claro"]{
  --bg:#eef0f8; --bg2:#ffffff; --card:#ffffff; --card2:#f1f2f9; --borda:#d3d7e6;
  --txt:#0d1020; --txt2:#4a5270; --txt3:#5f6784;
  --pri:#006fb5; --pri-txt:#ffffff; --roxo:#6a3ad4; --magenta:#c2105c; --ouro:#946000;
  --ok:#0a7c4b; --aviso:#946000; --perigo:#c41e30; --laranja:#ad5600;
  --brilho:0 2px 10px rgba(0,111,181,.22); --brilho-ok:0 2px 10px rgba(10,124,75,.2);
  --grade:rgba(0,111,181,.04);
  --sombra:0 10px 28px rgba(20,30,60,.12);
  color-scheme:light;
}

/* =========================================================
   BASE
   ========================================================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 var(--fonte);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px);background-size:36px 36px;background-attachment:fixed;
  padding-left:var(--lado)}
body.travado{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* Cabeçalho */
.topo{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--borda);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.topo-int{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.topo h1{font:700 22px/1.1 var(--fonte-d);letter-spacing:.01em}
.topo small{color:var(--txt3);font-size:12px}

main{max-width:760px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}

/* Navegação: barra inferior no celular, trilho no tablet, menu lateral no PC */
.abas{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--borda);padding-bottom:env(safe-area-inset-bottom)}
.abas-int{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.abas-marca{display:none}
.aba{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--txt3);font-size:11.5px;font-weight:600;transition:color .15s,background .15s;border-radius:12px}
.aba svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.aba.ativa{color:var(--pri)}
.aba.ativa svg{filter:drop-shadow(0 0 6px var(--pri))}

/* Blocos e títulos */
.bloco{background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);padding:16px;margin-bottom:14px}
.bloco>h2,.titulo-sec{font:700 12.5px var(--fonte-d);text-transform:uppercase;letter-spacing:.14em;color:var(--txt2);margin-bottom:12px}
.titulo-sec{margin:18px 2px 10px}
.ajuda{color:var(--txt2);font-size:13px;margin:0}
.vazio{text-align:center;color:var(--txt2);padding:28px 12px;border:1px dashed var(--borda);border-radius:var(--raio)}

/* Botões */
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--borda);background:var(--card2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,background .15s,opacity .15s,box-shadow .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-txt);border-color:transparent;box-shadow:var(--brilho);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);border-radius:0}
.btn.perigo{background:transparent;color:var(--perigo);border-color:color-mix(in srgb,var(--perigo) 60%,transparent)}
.btn.link{background:none;border:none;color:var(--pri);padding:0 6px;box-shadow:none}
.btn.mini{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.cheio{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.acoes-linha{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.acoes-linha .btn{flex:1 1 auto}
.icone-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--borda);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none}

/* Campos */
input,select,textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--borda);background:var(--bg);padding:10px 12px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
input[type=number]{font-family:var(--fonte-d);font-weight:700}
textarea{resize:vertical;min-height:90px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--pri);flex:none;box-shadow:none}
.form{display:grid;gap:12px}
.campo{display:grid;gap:5px;min-width:0}
.rotulo{font-size:12.5px;color:var(--txt2);font-weight:650}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.g3{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--txt2);cursor:pointer}
.check-mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--laranja);cursor:pointer}
.check-mini input{width:16px;height:16px;accent-color:var(--laranja)}

/* Busca e filtros */
.busca-linha{display:flex;gap:8px;margin-bottom:10px}
.busca-linha input{flex:1}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;padding:12px;background:var(--card);border:1px solid var(--borda);border-radius:var(--raio)}
.filtros .largo{grid-column:1/-1}
.contagem{font-size:12.5px;color:var(--txt3);margin:4px 2px 10px}
.badge-num{background:var(--magenta);color:#fff;border-radius:99px;font:700 11px var(--fonte-d);padding:1px 7px;margin-left:4px}

/* Alertas */
.alerta{padding:11px 13px;border-radius:10px;margin-bottom:12px;font-size:13.5px;background:color-mix(in srgb,var(--aviso) 12%,transparent);color:var(--txt);border:1px solid color-mix(in srgb,var(--aviso) 45%,transparent)}
.alerta b{color:var(--aviso)}
.aviso-backup{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;margin-bottom:14px;font-size:12.5px;color:var(--txt2);background:var(--card);border:1px dashed var(--borda)}
.frase{font-size:15px;color:var(--txt2);margin:2px 2px 16px;font-style:italic;display:flex;gap:8px;align-items:center}
.frase::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* Números do painel */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums.tres{grid-template-columns:repeat(3,1fr)}
.num{background:var(--card2);border-radius:12px;padding:12px 6px;text-align:center;border:1px solid transparent;width:100%;transition:border-color .15s,box-shadow .15s}
.num b{display:block;font:700 26px/1.1 var(--fonte-d);letter-spacing:0;font-variant-numeric:tabular-nums}
.num span{font-size:11.5px;color:var(--txt2)}
.num.c-plat b{color:var(--roxo)} .num.c-zer b{color:var(--ok)} .num.c-jog b{color:var(--pri)}

/* Barra de progresso */
.barra{display:block;height:8px;background:var(--card2);border:1px solid var(--borda);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--roxo));border-radius:99px;transition:width .5s ease}
.barra.ok i{background:var(--ok);box-shadow:var(--brilho-ok)}
.legenda{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--txt2);margin-top:5px}
.meta-anual{margin-bottom:12px}
.meta-anual:last-child{margin-bottom:0}
.meta-anual .linha{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.meta-anual .linha b{font-family:var(--fonte-d);font-variant-numeric:tabular-nums}
.meta-anual .barra:not(.ok) i{background:var(--roxo)}

/* Cards de jogo */
.lista{display:grid;gap:10px}
.card{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px;background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);cursor:pointer;text-align:left;width:100%;animation:entra .25s ease both;transition:border-color .15s,box-shadow .15s}
.card:active{transform:scale(.995)}
.capa{height:78px;border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;font-weight:700;font-family:var(--fonte-d);color:#fff;overflow:hidden;position:relative}
.capa .plat{font:700 10px var(--fonte);letter-spacing:.04em;opacity:.9}
.capa .ini{font-size:20px;letter-spacing:0}
.capa-PS4{background:linear-gradient(160deg,#2563eb,#0a1e5c)}
.capa-PS5{background:linear-gradient(160deg,#eef1f7,#8c96ab);color:#1a2033}
.capa-Steam{background:linear-gradient(160deg,#25476f,#0b1424);color:#c7d5e0}
.capa-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capa.com-img{justify-content:flex-end}
.capa.com-img .ini{display:none}
.capa.com-img .plat{position:relative;align-self:flex-start;background:rgba(0,0,0,.72);color:#fff;border-radius:4px;padding:1px 5px;font-size:9.5px;opacity:1}
.capa.mini.com-img .plat{display:none}
.capa-form{display:flex;gap:12px;align-items:center}
.lendo-topo{display:flex;gap:12px;align-items:center}
.card-corpo{min-width:0}
.card-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card h3{font-size:15.5px;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{font-size:12.5px;color:var(--txt2);margin-top:2px}
.info{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--txt2);margin-bottom:8px}
.est{font-size:10px;border:1px dashed var(--laranja);color:var(--laranja);border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--txt2);border:1px solid var(--borda);font-weight:600}
.chip.aviso{color:var(--aviso)} .chip.perigo{color:var(--perigo)} .chip.dup{color:var(--roxo)} .chip.ok{color:var(--ok)}
button.chip{cursor:pointer}

/* Selos de status */
.selo{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.st-fila{background:var(--card2);color:var(--txt2);border-color:var(--borda)}
.st-jogando{background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri);border-color:color-mix(in srgb,var(--pri) 45%,transparent)}
.st-zerado{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.st-plat{background:color-mix(in srgb,var(--roxo) 16%,transparent);color:var(--roxo);border-color:color-mix(in srgb,var(--roxo) 50%,transparent)}
.st-aband{background:color-mix(in srgb,var(--perigo) 14%,transparent);color:var(--perigo);border-color:color-mix(in srgb,var(--perigo) 45%,transparent)}
.st-nao{background:transparent;color:var(--txt3);border:1px dashed var(--txt3)}
.prio-Alta{color:var(--perigo);font-weight:700}
.prio-Média{color:var(--laranja);font-weight:700}
.prio-Baixa{color:var(--txt3);font-weight:700}

/* Mini cards (painel) */
.mini-lista{display:grid;gap:8px}
.mini-card{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:8px;text-decoration:none;color:inherit;transition:border-color .15s}
.capa.mini{width:44px;height:58px;flex:none;font-size:11px;justify-content:center;align-items:center}
.capa.livro{background:linear-gradient(160deg,#9a6744,#3e2615)}
.mini-info{flex:1;min-width:0;display:grid;gap:5px}
.mini-info strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-info small{font-size:12px;color:var(--txt2)}

/* Gráfico */
.grafico{width:100%;height:auto;display:block;max-height:260px}
.grafico .b-jogo{fill:var(--pri)} .grafico .b-livro{fill:var(--ok)}
.grafico text{fill:var(--txt3);font-size:9px;font-family:var(--fonte)}
.grafico .valor{fill:var(--txt2);font-size:8.5px;font-weight:700;font-family:var(--fonte-d)}
.grafico line{stroke:var(--borda);stroke-width:1}
.leg-graf{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--txt2);margin-top:8px}
.leg-graf i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Previsão */
.prev{display:grid;gap:10px}
.prev-item{background:var(--card2);border-radius:12px;padding:12px}
.prev-item b{font:700 18px var(--fonte-d)}
.prev-item p{margin:3px 0 0;font-size:12.5px;color:var(--txt2)}

/* Livros */
.lendo-card{background:linear-gradient(155deg,color-mix(in srgb,var(--ok) 11%,var(--card)),var(--card) 60%);border:1px solid color-mix(in srgb,var(--ok) 40%,var(--borda));padding:16px;margin-bottom:12px;animation:entra .25s ease both;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.lendo-card .rotulo-lendo{font:700 11px var(--fonte-d);letter-spacing:.14em;text-transform:uppercase;color:var(--ok)}
.lendo-card h3{font:700 20px/1.15 var(--fonte-d);margin:4px 0 2px}
.lendo-card .barra{height:12px}
.form-pagina{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:12px}
.form-pagina .btn{height:46px}
.form-pagina .btn.pri{background:var(--ok);box-shadow:var(--brilho-ok)}
.segmentado{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:4px;margin-bottom:12px}
.segmentado button{min-height:40px;border:none;background:transparent;border-radius:9px;font-weight:650;color:var(--txt2)}
.segmentado button.ativo{background:var(--card2);color:var(--txt);box-shadow:inset 0 -2px 0 var(--pri)}
.ordem{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ordem-item{display:grid;grid-template-columns:34px 24px 32px 1fr auto;align-items:center;gap:6px;background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:6px 8px 6px 2px;transition:box-shadow .15s,border-color .15s}
.alca{touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;height:48px;font-size:20px;color:var(--txt3);user-select:none;-webkit-user-select:none}
.pos{font:700 15px var(--fonte-d);color:var(--txt3);text-align:center}
.ordem-info{min-width:0;cursor:pointer;padding:4px 0}
.ordem-info strong{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordem-info small{font-size:12px;color:var(--txt2)}
.ordem-info .chips{margin-top:4px}
.setas{display:flex;flex-direction:column;gap:4px}
.setas button{width:40px;height:32px;border-radius:8px;background:var(--card2);border:1px solid var(--borda);font-size:12px;color:var(--txt2)}
.setas button:disabled{opacity:.3}
.arrastando{box-shadow:var(--sombra),var(--brilho);border-color:var(--pri);position:relative;z-index:2;background:var(--card2)}
.em-arraste{user-select:none;-webkit-user-select:none}
.em-arraste .aviso-denso{display:none}
.aviso-denso{font-size:12.5px;color:var(--txt);padding:8px 10px;border:1px dashed color-mix(in srgb,var(--aviso) 60%,transparent);background:color-mix(in srgb,var(--aviso) 10%,transparent);border-radius:8px}
.dif-Leve{color:var(--ok)} .dif-Média{color:var(--laranja)} .dif-Densa{color:var(--perigo)}
.estrelas-txt{color:var(--ouro);letter-spacing:1px}

/* Folha (modal inferior) */
.sheet-fundo{position:fixed;inset:0;background:rgba(3,4,10,.66);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;transition:opacity .2s}
.sheet-fundo.aberto{opacity:1}
.sheet{background:var(--card);border:1px solid var(--borda);border-bottom:0;width:100%;max-width:620px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.aberto .sheet{transform:none}
@media (min-width:700px){.sheet-fundo{align-items:center;padding:24px}.sheet{border-radius:18px;border-bottom:1px solid var(--borda);max-width:560px;max-height:86vh}}
.sheet-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--borda)}
.sheet-cab h2{font:700 19px var(--fonte-d)}
.sheet-corpo{overflow:auto;padding:16px 16px 22px;overscroll-behavior:contain}
.menu-opcoes{display:grid;gap:8px}
.opcao{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--borda);background:var(--card2);text-align:left;font-weight:600;width:100%;transition:border-color .15s}
.opcao.atual{border-color:var(--pri);box-shadow:var(--brilho)}
.ponto{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.estrelas{display:flex;justify-content:center;gap:6px;margin:16px 0}
.estrela{width:54px;height:54px;border-radius:14px;border:1px solid var(--borda);background:var(--card2);font-size:28px;color:var(--ouro)}
.estrela.on{background:color-mix(in srgb,var(--ouro) 18%,var(--card));border-color:color-mix(in srgb,var(--ouro) 55%,transparent);text-shadow:0 0 12px color-mix(in srgb,var(--ouro) 70%,transparent)}
.resumo{font-size:13px;color:var(--txt2);background:var(--card2);border-radius:10px;padding:10px 12px;min-height:40px}
.sugestao{background:var(--card2);border:1px solid color-mix(in srgb,var(--pri) 45%,var(--borda));border-radius:var(--raio);padding:12px;display:grid;grid-template-columns:58px 1fr;gap:12px;margin-bottom:12px}
.motivo{font-size:13.5px;color:var(--txt2);margin:0 0 14px}

/* Configurações */
.cfg-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.cfg-linha+.cfg-linha{border-top:1px solid var(--borda)}
.cfg-linha input{width:110px;text-align:center}
.cfg-linha span{font-size:14px}
.cfg-linha small{display:block;color:var(--txt3);font-size:12px}
.grade-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Aviso flutuante */
.toast{position:fixed;left:calc(50% + var(--lado) / 2);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--card);color:var(--txt);border:1px solid color-mix(in srgb,var(--ok) 50%,var(--borda));padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--sombra);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.erro{background:var(--perigo);color:#fff;border-color:transparent}
.toast.aviso{background:var(--aviso);color:#1a1205;border-color:transparent}

/* Nuvem, login e sincronização */
.topo-acoes{display:flex;gap:8px;align-items:center}
.nuvem{min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--borda);background:var(--card);font-size:12.5px;font-weight:650;color:var(--txt2);display:inline-flex;align-items:center;gap:6px}
.nuvem .bolinha{width:8px;height:8px;border-radius:50%;background:var(--txt3)}
.nuvem.ok .bolinha{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.nuvem.sync .bolinha,.nuvem.pendente .bolinha{background:var(--pri);animation:pulsa 1s infinite}
.nuvem.erro .bolinha{background:var(--aviso)}
@keyframes pulsa{50%{opacity:.25}}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;
  background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px);background-size:32px 32px}
.login-caixa{width:100%;max-width:380px}
.login h2{font:700 32px var(--fonte-d);margin-bottom:6px}
.login .logo{width:64px;height:72px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--pri),var(--magenta));color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:14px}
.erro-txt{color:var(--perigo);font-size:13px;margin:0;min-height:18px}
.sync-item{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--borda)}
.sync-item b{font-size:14.5px}
.sync-item small{color:var(--txt2);font-size:12.5px}
.integracao{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.integracao+.integracao{border-top:1px solid var(--borda)}
.integracao span{font-size:14px;font-weight:650}
.integracao small{display:block;color:var(--txt3);font-size:12px;font-weight:400}
.carregando{text-align:center;color:var(--txt2);padding:30px 10px}
.carregando::before{content:"";display:block;width:28px;height:28px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--card2);border-top-color:var(--pri);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* =========================================================
   GAMIFICAÇÃO: jogador, chefão, próximo alvo, conquistas, celebração
   ========================================================= */
:root{--c-comum:#b9c0d2;--c-rara:#5bb0ff;--c-epica:var(--roxo);--c-lendaria:var(--ouro)}
[data-tema="claro"]{--c-comum:#4a5270;--c-rara:#1d5fd0}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn .ico{width:18px;height:18px}
.ico-titulo{width:15px;height:15px;vertical-align:-2px;margin-right:6px;color:var(--pri)}
.xp{color:var(--magenta);font-family:var(--fonte-d);font-weight:700;font-variant-numeric:tabular-nums}
.xp-alvo{color:var(--txt3);font-family:var(--fonte-d);font-weight:600}
.meta-plat{color:var(--roxo);font-weight:700}
.rot-mag{display:block;font:700 11px var(--fonte-d);letter-spacing:.14em;text-transform:uppercase;color:var(--magenta)}

.jogador{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;text-decoration:none;color:inherit;
  background:linear-gradient(135deg,color-mix(in srgb,var(--magenta) 13%,var(--card)),var(--card) 62%);border:1px solid color-mix(in srgb,var(--magenta) 35%,var(--borda));
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.anel{--p:0%;flex:none;width:68px;height:68px;border-radius:50%;padding:4px;background:conic-gradient(var(--magenta) var(--p),var(--card2) 0);box-shadow:0 0 16px color-mix(in srgb,var(--magenta) 40%,transparent)}
.anel>span{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.anel small{font:700 9px var(--fonte-d);letter-spacing:.14em;color:var(--txt2)}
.anel b{font:700 25px var(--fonte-d)}
.anel.grande{width:116px;height:116px;padding:5px}
.anel.grande b{font-size:46px}
.anel.grande small{font-size:11px}
.jogador-info{flex:1;min-width:0;display:grid;gap:5px}
.jogador-info strong{font:700 19px/1.15 var(--fonte-d)}
.jogador-info .legenda{margin-top:0}
.jogador-info .legenda b{font-family:var(--fonte-d);color:var(--txt)}
.barra.xp{height:10px}
.barra.xp i{background:linear-gradient(90deg,var(--pri),var(--magenta));box-shadow:var(--brilho)}
.painel-grade>.jogador{margin-bottom:0}
.jogador-medalhas{flex:none;text-align:center;padding:8px 12px;border-radius:10px;background:var(--card2)}
.jogador-medalhas b{display:block;font:700 22px var(--fonte-d);color:var(--roxo)}
.jogador-medalhas small{font-size:11px;color:var(--txt2)}
@media (max-width:420px){.jogador-medalhas{display:none}}

.chefao{border-color:color-mix(in srgb,var(--perigo) 40%,var(--borda))}
.chefao-topo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.chefao-ico{width:48px;height:48px;padding:11px;border-radius:10px;color:var(--perigo);background:color-mix(in srgb,var(--perigo) 15%,var(--card2))}
.chefao-topo h3{font:700 19px var(--fonte-d)}
.rot-chefe{font:700 11px var(--fonte-d);letter-spacing:.12em;text-transform:uppercase;color:var(--perigo);white-space:nowrap}
.chefao-hp{margin-left:auto;text-align:right}
.chefao-hp b{display:block;font:700 20px var(--fonte-d);color:var(--perigo);font-variant-numeric:tabular-nums}
.chefao-hp small{font-size:11.5px;color:var(--txt2)}
.barra.boss{height:14px;border-radius:4px}
.barra.boss i{border-radius:3px;background:linear-gradient(90deg,var(--perigo),var(--laranja))}
.chefao .prev{margin-top:12px}
@media (min-width:600px){.chefao .prev{grid-template-columns:1fr 1fr}}
.prev-item small{display:block;font-size:11.5px;color:var(--txt2);margin-bottom:2px}

.alvo{border-color:color-mix(in srgb,var(--pri) 50%,var(--borda))}
.alvo-corpo{display:flex;gap:12px;align-items:center}
.alvo-corpo>div{min-width:0}
.alvo-corpo strong{display:block;font-size:15px}
.alvo-corpo small{display:block;font-size:12.5px;color:var(--txt2);margin-top:2px}
.alvo-corpo small.xp{color:var(--magenta)}

.perfil-topo{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--magenta) 13%,var(--card)),var(--card) 62%);border-color:color-mix(in srgb,var(--magenta) 35%,var(--borda))}
.perfil-info{flex:1;min-width:0;display:grid;gap:6px}
.perfil-titulo{font:700 26px/1.15 var(--fonte-d)}
.perfil-info .legenda b{font-family:var(--fonte-d)}
@media (max-width:480px){.perfil-topo{flex-direction:column;text-align:center}.perfil-info .legenda{text-align:left}}
.xp-linha{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--borda);font-size:13.5px}
.xp-linha:first-of-type{border-top:0}
.xp-linha b{font-family:var(--fonte-d);text-align:right}
.xp-linha.total{border-top:1px solid var(--txt3);font-weight:700}
.titulos{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.titulos li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--txt3);background:var(--card2);font-size:14px}
.titulos li.ok{color:var(--txt)}
.titulos li.atual{outline:1px solid var(--magenta);color:var(--magenta);font-weight:700}
.num-tit{font:700 11px var(--fonte-d);letter-spacing:.08em;min-width:44px;color:var(--txt2)}

.filtro-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--borda);background:var(--card2);font-weight:600;font-size:13px;color:var(--txt2)}
.fchip.ativo{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.medalhas{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.medalha-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--borda)}
.medalha{width:60px;height:68px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;color:#fff}
.medalha .ico{width:26px;height:26px}
.medalha.grande{width:104px;height:116px}
.medalha.grande .ico{width:48px;height:48px}
.r-comum .medalha{background:linear-gradient(160deg,#c9cfdd,#5d6478);color:#0b0d18}
.r-rara .medalha{background:linear-gradient(160deg,#5bb8ff,#1d4ed8)}
.r-epica .medalha{background:linear-gradient(160deg,#d2b0ff,#6a3ad4)}
.r-lendaria .medalha{background:linear-gradient(160deg,#ffe28a,#c77d00);color:#3a2400}
.medalha-card.bloq .medalha{background:var(--card);color:var(--txt3)}
.medalha-card.r-epica:not(.bloq){border-color:color-mix(in srgb,var(--c-epica) 50%,var(--borda))}
.medalha-card.r-lendaria:not(.bloq){border-color:color-mix(in srgb,var(--c-lendaria) 55%,var(--borda))}
.medalha-card b{font-size:13.5px}
.medalha-card small{font-size:12px;color:var(--txt2);line-height:1.3}
.medalha-card .rar{font-size:11.5px;font-weight:700}
.r-comum .rar{color:var(--c-comum)} .r-rara .rar{color:var(--c-rara)} .r-epica .rar{color:var(--c-epica)} .r-lendaria .rar{color:var(--c-lendaria)}
.medalha-card.bloq .rar{color:var(--txt3)}
.medalha-card .barra{width:80%;height:5px;border:0}
.medalha-card .barra i{background:var(--txt3)}

.celebra{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(3,4,10,.82);opacity:0;transition:opacity .2s}
.celebra.aberto{opacity:1}
.celebra-caixa{width:100%;max-width:380px;max-height:100%;overflow:auto;padding:26px 22px 22px;background:var(--card);border:1px solid var(--magenta);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);transform:scale(.92);transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.celebra.aberto .celebra-caixa{transform:none}
.celebra h2{font:700 25px/1.2 var(--fonte-d)}
.celebra-ganho{font:700 36px var(--fonte-d);color:var(--magenta);text-shadow:0 0 18px color-mix(in srgb,var(--magenta) 55%,transparent);animation:pulsa-xp 1.2s ease 2}
@keyframes pulsa-xp{50%{transform:scale(1.08)}}
.celebra-capa .capa{width:96px;height:132px;box-shadow:var(--brilho-ok)}
.celebra-lista{width:100%;display:grid;gap:8px}
.celebra-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card2);text-align:left;font-size:13.5px}
.celebra-item .medalha{width:30px;height:34px}
.celebra-item .medalha .ico{width:15px;height:15px}

/* Retrospectiva */
.retro-capa{display:grid;gap:8px;text-align:center;justify-items:center;padding:22px 16px;border-color:color-mix(in srgb,var(--magenta) 40%,var(--borda));
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--magenta) 16%,var(--card)),var(--card) 70%)}
.retro-anos{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:6px}
.bloco>h2.retro-titulo{font:700 30px/1.1 var(--fonte-d);text-transform:none;letter-spacing:0;color:var(--txt);margin:0}
.retro-frase{margin:0;color:var(--txt2);font-style:italic}
.retro-xp{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.retro-xp b{font-size:38px;text-shadow:0 0 18px color-mix(in srgb,var(--magenta) 50%,transparent)}
.retro-xp span{font-size:12.5px;color:var(--txt2)}
.retro-nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.retro-nums{grid-template-columns:repeat(4,minmax(0,1fr))}}
.retro-num{background:var(--card2);border-radius:12px;padding:14px 12px;display:grid;gap:2px}
.retro-num b{font:700 30px/1.1 var(--fonte-d);font-variant-numeric:tabular-nums}
.retro-num span{font-size:12px;color:var(--txt2)}
.retro-dests{display:grid;gap:8px}
.retro-dest{background:var(--card2);border-radius:12px;padding:10px 12px;display:grid;gap:1px}
.retro-dest small{font:700 11px var(--fonte-d);letter-spacing:.12em;text-transform:uppercase;color:var(--txt2)}
.retro-dest b{font-size:15px}
.retro-dest span{font-size:12.5px;color:var(--txt2)}
.retro-galeria{display:flex;flex-wrap:wrap;gap:8px}
.retro-fim{display:grid;gap:10px;text-align:center;justify-items:center}
.retro-chamada{display:grid;gap:3px;text-decoration:none;color:inherit;border-color:color-mix(in srgb,var(--magenta) 45%,var(--borda));background:linear-gradient(135deg,color-mix(in srgb,var(--magenta) 14%,var(--card)),var(--card) 60%)}
.retro-chamada b{font:700 18px var(--fonte-d)}
.retro-chamada small{font-size:12.5px;color:var(--txt2)}
.perfil-info .btn.mini{min-height:38px}

/* Missões e sequência */
.titulo-linha{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.titulo-linha h2{font:700 12.5px var(--fonte-d);text-transform:uppercase;letter-spacing:.14em;color:var(--txt2);margin:0}
.titulo-linha .btn.mini{min-height:36px}
.lista-missoes{display:grid;gap:8px}
.missao{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid transparent;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s}
.missao:active{transform:scale(.99)}
.missao-rodape{display:flex;justify-content:space-between;gap:8px}
.missao-guia{color:var(--pri)!important;font-weight:600;white-space:nowrap}
@media (hover:hover){.missao:hover{border-color:color-mix(in srgb,var(--pri) 55%,var(--borda))}}
.guia{display:grid;gap:10px}
.guia-topo{display:flex;gap:12px;align-items:center}
.guia-meta{font-size:13px;color:var(--txt2);margin-top:2px}
.guia-tit{font:700 12.5px var(--fonte-d);text-transform:uppercase;letter-spacing:.14em;color:var(--txt2);margin-top:6px}
.guia-passos{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14.5px;line-height:1.45}
.guia-passos li::marker{color:var(--pri);font-family:var(--fonte-d);font-weight:700}
.guia-intro{margin:0;font-size:14.5px}
.guia-dica{display:flex;gap:10px;padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.45;background:color-mix(in srgb,var(--pri) 9%,transparent);border:1px solid color-mix(in srgb,var(--pri) 35%,transparent)}
.guia-dica .ico{color:var(--pri);margin-top:1px}
.missao.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.missao-ico{flex:none;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri)}
.missao.ok .missao-ico{background:var(--ok);color:var(--pri-txt)}
[data-tema="claro"] .missao.ok .missao-ico{color:#fff}
.missao-corpo{flex:1;min-width:0;display:grid;gap:5px}
.missao-topo{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.missao.ok .missao-topo b{color:var(--txt2)}
.missao-corpo small{font-size:12px;color:var(--txt2)}
.missao .barra{height:6px}
.seq-mini{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt2);margin:-4px 0 10px}
.seq-mini .ico{width:16px;height:16px;color:var(--ouro)}
.seq-mini b{color:var(--txt);font-family:var(--fonte-d)}
.sequencia{border-color:color-mix(in srgb,var(--ouro) 45%,var(--borda));background:linear-gradient(160deg,color-mix(in srgb,var(--ouro) 11%,var(--card)),var(--card) 55%)}
.seq-topo{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.seq-ico{width:56px;height:56px;padding:12px;border-radius:14px;color:var(--ouro);background:color-mix(in srgb,var(--ouro) 16%,transparent)}
.seq-num{font:700 17px var(--fonte-d)}
.seq-num b{font-size:34px;margin-right:4px}
.seq-topo small{font-size:12.5px;color:var(--txt2)}
.seq-escudos{margin-left:auto;display:flex;gap:4px}
.seq-escudos .ico{width:24px;height:24px;color:var(--borda)}
.seq-escudos .ico.on{color:var(--pri);filter:drop-shadow(0 0 5px var(--pri))}
.seq-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:420px}
.seq-dia{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--txt2)}
.seq-dia b{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid var(--borda);background:var(--card2);color:var(--txt2)}
.seq-dia .ico{width:16px;height:16px}
.seq-dia.st-ok b{background:var(--ouro);border-color:var(--ouro);color:#1a1205}
.seq-dia.st-escudo b{border-color:var(--pri);color:var(--pri)}
.seq-dia.st-hoje b{border:2px solid var(--ouro);color:var(--ouro);font-size:20px}
.seq-dia.st-perdido b{border-style:dashed;border-color:var(--perigo)}
.sessao-linha{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.missao-emblema{width:84px;height:84px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--ok);color:var(--pri-txt);box-shadow:var(--brilho-ok)}
.missao-emblema .ico{width:46px;height:46px;stroke-width:3}
.missao-emblema.mini{width:30px;height:30px;border-radius:8px;flex:none}
.missao-emblema.mini .ico{width:16px;height:16px}
.icone-btn .ico{width:20px;height:20px}
a.icone-btn{color:var(--txt)}
/* Celular: Ajustes sai da barra (5 abas) e vai para a engrenagem do topo */
@media (max-width:599px){.aba[data-aba="config"]{display:none}}
@media (min-width:600px){.so-celular{display:none!important}}

/* Realce ao passar o mouse (só onde existe mouse) */
@media (hover:hover){
  .card:hover,.mini-card:hover,.opcao:hover{border-color:color-mix(in srgb,var(--pri) 60%,var(--borda))}

<script>
'use strict';
/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
// Escapa texto para inserir em HTML com segurança
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// Data de hoje no formato AAAA-MM-DD (fuso local)
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtData = iso => iso ? iso.split('-').reverse().join('/') : '—';
const anoDe = iso => iso ? Number(iso.slice(0, 4)) : null;
const mesDe = iso => Number(iso.slice(5, 7)) - 1;
// Normaliza texto para busca/comparação (sem acentos, minúsculo)
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const limitar = (v, a, b) => v == null ? null : Math.min(b, Math.max(a, Math.round(v)));
const positivo = v => v == null ? null : Math.max(0, v);
const fmtNum = n => Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const diasDesde = iso => iso ? Math.floor((Date.now() - Date.parse(iso)) / 864e5) : null;
const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

/* =========================================================
   CONSTANTES DO DOMÍNIO
   ========================================================= */
const PLATAFORMAS = ['PS4', 'PS5', 'Steam'];
const STATUS_JOGO = ['Na fila', 'Jogando', 'Zerado', 'Platinado/100%', 'Abandonado', 'Não pretendo jogar'];
const METAS = [['Só zerar', 'Só zerar'], ['Platinar', 'Platinar (PlayStation)'], ['100% conquistas', '100% conquistas (Steam)']];
const PRIORIDADES = ['Alta', 'Média', 'Baixa'];
const ONLINE = ['Não tem', 'Tem — verificar se servidores estão ativos', 'Impossível platinar'];
const CATEGORIAS = ['Filosofia', 'Literatura', 'Outro'];
const DIFS_LIVRO = ['Leve', 'Média', 'Densa'];
const STATUS_LIVRO = ['Lendo', 'Na fila', 'Lido', 'Abandonado'];
const FORMATOS = ['Físico', 'Audiolivro', 'Digital'];
const CONCLUIDO = ['Zerado', 'Platinado/100%'];
const PRI_IDX = { 'Alta': 0, 'Média': 1, 'Baixa': 2 };
const STATUS_CLASSE = {
  'Na fila': 'st-fila', 'Jogando': 'st-jogando', 'Zerado': 'st-zerado', 'Platinado/100%': 'st-plat',
  'Abandonado': 'st-aband', 'Não pretendo jogar': 'st-nao', 'Lendo': 'st-jogando', 'Lido': 'st-zerado'
};

/* =========================================================
   MODELOS PADRÃO
   ========================================================= */
const configPadrao = () => ({ horasSemana: 7, paginasDia: 20, metaPlatinas: 6, metaLivros: 12, tema: 'escuro', descanso: '' });
const jogoPadrao = () => ({
  id: uid(), nome: '', plataforma: 'PS4', status: 'Na fila', meta: 'Platinar', dificuldade: null,
  horasEstimadas: null, horasJogadas: 0, progresso: 0, prioridade: 'Média', online: ONLINE[0],
  inicio: '', conclusao: '', notas: '', estDif: false, estHoras: false, grupo: null, versaoEscolhida: false,
  steamAppId: null, psnId: null, // preenchidos pela sincronização
  imagem: '' // capa vinda da PSN (a da Steam é montada pelo steamAppId)
});
const livroPadrao = () => ({
  id: uid(), titulo: '', autor: '', categoria: 'Filosofia', dificuldade: 'Média', status: 'Na fila', formato: 'Físico',
  totalPaginas: null, paginaAtual: 0, ordem: 0, semPosicao: false, inicio: '', fim: '', avaliacao: null, notas: '',
  capa: '', capaBuscada: false // capa achada no Google Books / Open Library
});
const integracoesPadrao = () => ({ steam: null, psn: null, ignorados: { steam: [], psn: [] } });
const estadoVazio = () => ({ versao: 1, jogos: [], livros: [], config: configPadrao(), ultimoBackup: null, integracoes: integracoesPadrao(), eventos: {}, gamer: gamerPadrao() });

/* =========================================================
   DADOS INICIAIS
   Dificuldade e horas são estimativas aproximadas da comunidade
   (guias de troféus). Ficam marcadas como "estimativa" para correção.
   Formato: [nome, plataforma, dificuldade, horas, tem troféu online?, nota]
   ========================================================= */
const NOTA_NOVO = 'Lançamento recente: estimativa bem incerta.';
const BASE_JOGOS = [
  ['Days Gone', 'PS4', 4, 50, 0],
  ['Hogwarts Legacy', 'PS4', 3, 55, 0],
  ['Dark Souls II: Scholar of the First Sin', 'PS4', 7, 100, 1, 'Troféus de pactos dependem do online.'],
  ["Assassin's Creed IV Black Flag", 'PS4', 4, 40, 0],
  ['Star Wars Battlefront', 'PS4', 5, 60, 1],
  ['Shadow of the Colossus', 'PS4', 5, 20, 0],
  ['The Witcher 3: Wild Hunt', 'PS4', 4, 100, 0],
  ['Death Stranding', 'PS4', 5, 90, 1, 'Alguns troféus usam recursos online (curtidas, estruturas compartilhadas).'],
  ['Watch Dogs 2', 'PS4', 5, 50, 1],
  ['Watch Dogs', 'PS4', 5, 45, 1],
  ['Mortal Kombat X', 'PS4', 6, 60, 1],
  ["Tom Clancy's The Division", 'PS4', 5, 80, 1],
  ['Killzone Shadow Fall', 'PS4', 6, 50, 1],
  ['Mafia III', 'PS4', 3, 50, 0],
  ['DOOM', 'PS4', 7, 40, 1, 'Confirmar versão (DOOM 2016 ou DOOM Eternal?).'],
  ['Horizon Zero Dawn', 'PS4', 3, 60, 0],
  ['Horizon Zero Dawn Complete Edition', 'PS4', 3, 60, 0],
  ['Red Dead Redemption 2', 'PS4', 6, 150, 1],
  ['Dragon Age: Inquisition', 'PS4', 5, 120, 1],
  ['Nioh', 'PS4', 7, 120, 0],
  ['The Last of Us Remasterizado', 'PS4', 6, 80, 1],
  ['Uncharted: The Nathan Drake Collection', 'PS4', 6, 70, 0],
  ['God of War', 'PS4', 4, 50, 0],
  ['God of War III Remasterizado', 'PS4', 4, 20, 0],
  ['Godfall', 'PS5', 4, 50, 0],
  ['The Last of Us Part II Remastered', 'PS5', 5, 40, 0],
  ['Ratchet & Clank: Em Uma Outra Dimensão', 'PS5', 2, 20, 0],
  ['Returnal', 'PS5', 7, 50, 0],
  ['Prince of Persia: The Lost Crown', 'PS5', 7, 45, 0],
  ['007 First Light', 'PS5', 4, 30, 0, NOTA_NOVO],
  ['Uncharted: Coleção Legado dos Ladrões', 'PS5', 5, 40, 0],
  ['Elden Ring', 'PS5', 5, 100, 0],
  ['Lost Soul Aside', 'PS5', 5, 40, 0, NOTA_NOVO],
  ['LEGO Batman: O Legado do Cavaleiro das Trevas', 'PS5', 2, 30, 0, NOTA_NOVO],
  ["Assassin's Creed Black Flag Resynced", 'PS5', 4, 40, 0, NOTA_NOVO],
  ['Forspoken', 'PS5', 3, 45, 0],
  ['God of War Ragnarök', 'PS5', 4, 60, 0],
  ['Chronos: The New Dawn', 'PS5', 5, 25, 0, NOTA_NOVO],
  ["Marvel's Wolverine", 'PS5', 4, 35, 0, NOTA_NOVO]
];
// [título, autor, categoria, dificuldade, notas]
const BASE_LIVROS = [
  ['A Rebelião das Massas', 'José Ortega y Gasset', 'Filosofia', 'Densa'],
  ['O Alienista', 'Machado de Assis', 'Literatura', 'Leve'],
  ['O Contrato Social', 'Jean-Jacques Rousseau', 'Filosofia', 'Média'],
  ['Vidas Secas', 'Graciliano Ramos', 'Literatura', 'Leve'],
  ['O Utilitarismo', 'John Stuart Mill', 'Filosofia', 'Média'],
  ['Gente Pobre', 'Fiódor Dostoiévski', 'Literatura', 'Média'],
  ['Analectos', 'Confúcio', 'Filosofia', 'Média'],
  ['Poética', 'Aristóteles', 'Filosofia', 'Média'],
  ['Leviatã', 'Thomas Hobbes', 'Filosofia', 'Densa'],
  ['Os Engastes da Sabedoria', 'Ibn Arabi', 'Filosofia', 'Densa'],
  ['Tractatus Logico-Philosophicus / Investigações Filosóficas', 'Ludwig Wittgenstein', 'Filosofia', 'Densa']
];
const LIVROS_SEM_POSICAO = [
  ['Contagem Regressiva', 'Alejandro Bullón', 'Outro', 'Média', 'Confirmar autor.'],
  ['Opúsculos Filosóficos', '', 'Filosofia', 'Média', 'Autor a confirmar.'],
  ['Na Outra Noite', 'Luc Colin', 'Outro', 'Média', 'Confirmar título e autor.'],
  ['Laocoonte', '', 'Filosofia', 'Média', 'Autor a confirmar (provavelmente G. E. Lessing).'],
  ['Todo Mundo é Lua', 'Orlando Tosetto', 'Literatura', 'Média']
];

function dadosIniciais() {
  const st = estadoVazio();
  st.jogos = BASE_JOGOS.map(([nome, plataforma, dif, horas, online, nota]) => Object.assign(jogoPadrao(), {
    nome, plataforma, dificuldade: dif, horasEstimadas: horas, estDif: true, estHoras: true,
    online: online ? ONLINE[1] : ONLINE[0], notas: nota || ''
  }));
  st.jogos.push(Object.assign(jogoPadrao(), {
    nome: 'Counter-Strike 2', plataforma: 'Steam', status: 'Jogando', meta: 'Só zerar', horasJogadas: 2313
  }));
  // Duplicados: mesmo jogo em versões diferentes
  const achar = n => st.jogos.find(j => j.nome === n);
  const ligar = (a, b) => { const g = uid(); achar(a).grupo = g; achar(b).grupo = g; };
  ligar("Assassin's Creed IV Black Flag", "Assassin's Creed Black Flag Resynced");
  ligar('Horizon Zero Dawn', 'Horizon Zero Dawn Complete Edition');

  st.livros = BASE_LIVROS.map(([titulo, autor, categoria, dificuldade], i) => Object.assign(livroPadrao(), {
    titulo, autor, categoria, dificuldade, ordem: i + 1, status: i === 0 ? 'Lendo' : 'Na fila', inicio: i === 0 ? hoje() : ''
  }));
  LIVROS_SEM_POSICAO.forEach(([titulo, autor, categoria, dificuldade, notas], i) => st.livros.push(Object.assign(livroPadrao(), {
    titulo, autor, categoria, dificuldade, notas: notas || '', ordem: BASE_LIVROS.length + i + 1, semPosicao: true
  })));
  st.semente = true; // marca: dados iniciais, ainda não editados
  return st;
}

/* =========================================================
   ARMAZENAMENTO (localStorage com proteção)
   ========================================================= */
const CHAVE = 'minhaEstante.v1';
let armazenamentoOk = true;
let state;

// Garante que dados antigos/importados tenham todos os campos
function migrar(d) {
  const st = Object.assign(estadoVazio(), d);
  st.config = Object.assign(configPadrao(), d.config || {});
  st.jogos = (d.jogos || []).map(j => Object.assign(jogoPadrao(), j));
  st.livros = (d.livros || []).map(l => Object.assign(livroPadrao(), l));
  st.integracoes = Object.assign(integracoesPadrao(), d.integracoes || {});
  st.integracoes.ignorados = Object.assign({ steam: [], psn: [] }, st.integracoes.ignorados || {});
  st.eventos = d.eventos && typeof d.eventos === 'object' ? d.eventos : {};
  st.gamer = Object.assign(gamerPadrao(), d.gamer || {});
  st.gamer.feitas = Object.assign({}, st.gamer.feitas || {});
  delete st.app; delete st.exportadoEm;
  return st;
}
function carregar() {
  try {
    localStorage.setItem(CHAVE + '.teste', '1'); localStorage.removeItem(CHAVE + '.teste');
  } catch (e) { armazenamentoOk = false; }
  try {
    const bruto = localStorage.getItem(CHAVE);
    if (bruto) {
      const d = JSON.parse(bruto);
      if (d && Array.isArray(d.jogos) && Array.isArray(d.livros)) return migrar(d);
    }
  } catch (e) { console.warn('Falha ao ler dados salvos', e); }
  return null;
}
// Grava só no aparelho
function salvarLocal() {
  try { localStorage.setItem(CHAVE, JSON.stringify(state)); return true; }
  catch (e) { toast('Não foi possível salvar neste navegador. Exporte um backup.', 'erro'); return false; }
}
// Grava no aparelho e agenda o envio para a nuvem (quando logado)
function salvar() {
  delete state.semente;
  atualizarMissoes();
  const ok = salvarLocal();
  marcarAlteracao();

}

// Progresso (0–100) de um jogo conforme a meta
function progressoJogo(j) {
  if (j.status === 'Platinado/100%') return 100;
  if (j.meta === 'Só zerar') {
    if (j.status === 'Zerado') return 100;
    return j.horasEstimadas > 0 ? Math.min(100, Math.round((j.horasJogadas || 0) / j.horasEstimadas * 100)) : 0;
  }
  return Math.min(100, Math.max(0, j.progresso || 0));
}
function legendaJogo(j) {
  const jog = `${fmtNum(j.horasJogadas)} h jogadas`;
  if (j.meta === 'Só zerar') return j.horasEstimadas ? `${fmtNum(j.horasJogadas)} de ~${fmtNum(j.horasEstimadas)} h` : jog;
  return `${progressoJogo(j)}% dos troféus · ${jog}`;
}
const progressoLivro = l => l.totalPaginas ? Math.min(100, Math.round((l.paginaAtual || 0) / l.totalPaginas * 100)) : 0;
const iniciais = n => String(n).replace(/[^\p{L}\p{N} ]/gu, ' ').split(/\s+/).filter(Boolean)
  .filter(w => !/^(the|of|de|da|do|em|a|o|uma|um)$/i.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';

// Converte semanas em texto legível
function duracaoSemanas(sem) {
  if (sem <= 0) return 'nada pendente';
  if (sem < 1) return 'menos de 1 semana';
  const meses = sem / 4.345;
  if (meses < 2) return `≈ ${Math.round(sem)} semanas`;
  if (meses < 24) return `≈ ${Math.round(sem)} semanas (≈ ${fmtNum(Math.round(meses))} meses)`;
  return `≈ ${Math.round(sem)} semanas (≈ ${fmtNum(Math.round(meses / 12 * 10) / 10)} anos)`;
}

// Remove marcações de duplicado de grupos com menos de 2 jogos
function limparGrupos() {
  const cont = {};
  state.jogos.forEach(j => { if (j.grupo) cont[j.grupo] = (cont[j.grupo] || 0) + 1; });
  state.jogos.forEach(j => { if (j.grupo && cont[j.grupo] < 2) { j.grupo = null; j.versaoEscolhida = false; } });
}

/* =========================================================
   GAMIFICAÇÃO: XP, níveis, chefão e conquistas
   Tudo é calculado a partir dos jogos e livros (nada novo é gravado),
   então o que já foi concluído antes também conta.
   ========================================================= */
const XP_LIVRO = { 'Leve': 80, 'Média': 120, 'Densa': 180 };
const RARIDADES = { comum: ['Comum', 10], rara: ['Rara', 50], epica: ['Épica', 150], lendaria: ['Lendária', 400] };
const TITULOS = [[1, 'Recruta da Estante'], [5, 'Explorador do Backlog'], [10, 'Caçador de Troféus'], [15, 'Devorador de Páginas'],
  [20, 'Caçador de Platinas'], [30, 'Mestre da Estante'], [40, 'Lenda do Backlog']];
const PAG_POR_HP = 30; // no chefão, 30 páginas valem o mesmo que 1 hora de jogo

// Platina/100% = 100 + 30 × dificuldade; zerar = 40 + 15 × dificuldade (dificuldade vazia conta como 5).
// Prioridade Alta: +25%. Platinar a versão escolhida de um duplicado: +50.
function xpBaseJogo(j, tipo) {
  const d = j.dificuldade ?? 5;
  let xp = tipo === 'plat' ? 100 + 30 * d : 40 + 15 * d;
  xp *= 1 + (j.prioridade === 'Alta' ? 0.25 : 0) + (j.bonusFoco ? 0.1 : 0);
  if (tipo === 'plat' && j.grupo && j.versaoEscolhida) xp += 50;
  if (j.bonusAlvo || (state.gamer && state.gamer.alvo === j.id)) xp += 50;
  return Math.ceil(xp);
}
const xpGanhoJogo = j => j.status === 'Platinado/100%' ? xpBaseJogo(j, 'plat') : j.status === 'Zerado' ? xpBaseJogo(j, 'zerar') : 0;
const xpAlvoJogo = j => xpBaseJogo(j, j.meta === 'Só zerar' ? 'zerar' : 'plat');
// Livro: Leve 80 · Média 120 · Densa 180, + 1 XP a cada 10 páginas
const xpLivro = l => (XP_LIVRO[l.dificuldade] || 120) + Math.ceil((l.totalPaginas || 0) / 10);
const xpGanhoLivro = l => l.status === 'Lido' ? xpLivro(l) : 0;

// Para subir do nível N são precisos 50 × (N + 7) XP
const xpParaSubir = n => 50 * (n + 7);
function nivelDe(xp) {
  let nivel = 1, resto = xp;
  while (resto >= xpParaSubir(nivel)) { resto -= xpParaSubir(nivel); nivel++; }
  return { nivel, noNivel: resto, precisa: xpParaSubir(nivel) };
}
const tituloDe = n => TITULOS.filter(([m]) => n >= m).pop()[1];
const proximoTitulo = n => TITULOS.find(([m]) => m > n) || null;

// Chefão "O Backlog": vida = horas que faltam + páginas que faltam ÷ 30
function chefao() {
  const J = state.jogos, L = state.livros;
  const pend = J.filter(j => ['Na fila', 'Jogando'].includes(j.status) && j.meta && j.horasEstimadas > 0);
  const filaL = L.filter(l => ['Na fila', 'Lendo'].includes(l.status) && l.totalPaginas > 0);
  const hRest = pend.reduce((s, j) => s + Math.max(0, j.horasEstimadas - (j.horasJogadas || 0)), 0);
  const pRest = filaL.reduce((s, l) => s + Math.max(0, l.totalPaginas - (l.paginaAtual || 0)), 0);
  const hFeitas = J.filter(j => CONCLUIDO.includes(j.status)).reduce((s, j) => s + (j.horasEstimadas || 0), 0)
    + pend.reduce((s, j) => s + Math.min(j.horasEstimadas, j.horasJogadas || 0), 0);
  const pFeitas = L.filter(l => l.status === 'Lido').reduce((s, l) => s + (l.totalPaginas || 0), 0)
    + filaL.reduce((s, l) => s + Math.min(l.totalPaginas, l.paginaAtual || 0), 0);
  const hp = Math.round(hRest + pRest / PAG_POR_HP), dano = Math.round(hFeitas + pFeitas / PAG_POR_HP);
  const max = hp + dano, pct = max ? Math.round(dano / max * 100) : 0;
  const fase = max === 0 ? 'sem dados' : hp === 0 ? 'derrotado' : pct >= 67 ? 'Fase final · fúria' : pct >= 34 ? 'Fase 2 · ferido' : 'Fase 1';
  return { hp, max, pct, fase };
}

// Resumo do jogador: XP total, nível, título e conquistas
function jogador() {
  const xpJogos = state.jogos.reduce((s, j) => s + xpGanhoJogo(j), 0);
  const xpLivros = state.livros.reduce((s, l) => s + xpGanhoLivro(l), 0);
  const cq = conquistas();
  const xpConq = cq.filter(c => c.ok).reduce((s, c) => s + RARIDADES[c.rar][1], 0);
  const feitas = state.gamer.feitas, seq = sequencia();
  const xpMissoes = Object.values(feitas).reduce((s, m) => s + (m.xp || 0), 0);
  const xpRitmo = xpDoRitmo(), xpSeq = seq.marcos * 50;
  const xp = xpJogos + xpLivros + xpConq + xpMissoes + xpRitmo + xpSeq;
  return Object.assign({ xp, xpJogos, xpLivros, xpConq, xpMissoes, xpRitmo, xpSeq, seq, feitas: Object.keys(feitas), conquistas: cq }, nivelDe(xp));
}

// Celebração: compara o jogador antes e depois de uma ação e mostra o que mudou.
// motivo: { tipo: 'plat' | 'zerado' | 'livro', item } (opcional); depois: função chamada ao fechar.
let aoFecharCelebracao = null;
function celebrar(antes, agora, motivo, depois) {
  const ganho = agora.xp - antes.xp;
  const novas = agora.conquistas.filter(c => c.ok && !(antes.conquistas.find(a => a.id === c.id) || {}).ok);
  const subiu = agora.nivel > antes.nivel;
  const tipo = motivo && motivo.tipo;
  const missoes = agora.feitas.filter(k => !antes.feitas.includes(k)).map(k => state.gamer.feitas[k]).filter(Boolean);
  const grandes = missoes.filter(m => m.freq !== 'diaria');
  if (!subiu && !novas.length && !grandes.length && tipo !== 'plat' && tipo !== 'livro') {
    if (missoes.length) toast(`Missão concluída: ${missoes.map(m => m.nome).join(' · ')} · +${fmtNum(ganho)} XP`);
    else if (ganho > 0) toast(`+${fmtNum(ganho)} XP`);
    if (depois) depois();
    return;
  }
  const nome = motivo && motivo.item ? (motivo.item.nome || motivo.item.titulo) : '';
  let rotulo, titulo, emblema;
  if (subiu) {
    rotulo = 'Subiu de nível';
    titulo = tituloDe(agora.nivel) !== tituloDe(antes.nivel) ? `Novo título: ${tituloDe(agora.nivel)}` : tituloDe(agora.nivel);
    emblema = `<span class="anel grande" style="--p:${Math.round(agora.noNivel / agora.precisa * 100)}%"><span><small>NÍVEL</small><b>${agora.nivel}</b></span></span>`;
  } else if (tipo === 'plat') {
    rotulo = 'Platina conquistada'; titulo = nome;
    emblema = `<div class="r-epica"><span class="medalha grande">${ico('trofeu')}</span></div>`;
  } else if (tipo === 'livro') {
    rotulo = 'Livro concluído'; titulo = nome;
    emblema = `<div class="celebra-capa">${capaLivro(motivo.item)}</div>`;
  } else if (!novas.length && grandes.length) {
    rotulo = grandes[0].freq === 'semanal' ? 'Missão semanal concluída' : 'Missão da temporada concluída'; titulo = grandes[0].nome;

  const r2 = c.metaLivros > 0 ? lidosAno / c.metaLivros : 1;

  if (platAno + lidosAno === 0) return 'Uma sessão ou um capítulo hoje já conta.';
  if (r >= fracAno + 0.05) return 'Você está à frente do ritmo do ano. Bom trabalho.';

function svgGrafico(ano) {

/* =========================================================

let anoRetro = null;
const anoRetroPadrao = () => { const d = new Date(); return d.getMonth() === 0 ? d.getFullYear() - 1 : d.getFullYear(); };
function anosComDados() {
  const anos = new Set([new Date().getFullYear()]);
  state.jogos.forEach(j => { if (CONCLUIDO.includes(j.status) && j.conclusao) anos.add(anoDe(j.conclusao)); });
  state.livros.forEach(l => { if (l.status === 'Lido' && l.fim) anos.add(anoDe(l.fim)); });
  Object.keys(state.eventos || {}).forEach(d => anos.add(anoDe(d)));
  return [...anos].filter(Boolean).sort((a, b) => b - a);
}
function dadosRetro(ano) {
  const J = state.jogos, L = state.livros, c = state.config;
  const plats = J.filter(j => j.status === 'Platinado/100%' && anoDe(j.conclusao) === ano);
  const zerados = J.filter(j => j.status === 'Zerado' && anoDe(j.conclusao) === ano);
  const lidos = L.filter(l => l.status === 'Lido' && anoDe(l.fim) === ano);
  const dias = Object.keys(state.eventos || {}).filter(d => anoDe(d) === ano && diaAtivo(d)).sort();
  const evAno = dias.map(ev);
  // Maior sequência dentro do ano (sem escudos, só dias seguidos de verdade)
  let maior = 0, corr = 0, ant = null;
  dias.forEach(d => { corr = ant && somaDias(ant, 1) === d ? corr + 1 : 1; maior = Math.max(maior, corr); ant = d; });
  const porMes = Array(12).fill(0);
  [...plats, ...zerados].forEach(j => porMes[mesDe(j.conclusao)]++);
  lidos.forEach(l => porMes[mesDe(l.fim)]++);
  const melhorMes = porMes.some(Boolean) ? porMes.indexOf(Math.max(...porMes)) : -1;
  const missoes = Object.values(state.gamer.feitas).filter(m => anoDe(m.data) === ano);
  const conq = conquistas().filter(q => q.ok && anoDe(q.data) === ano);
  const xp = plats.reduce((s, j) => s + xpGanhoJogo(j), 0) + zerados.reduce((s, j) => s + xpGanhoJogo(j), 0)
    + lidos.reduce((s, l) => s + xpLivro(l), 0) + missoes.reduce((s, m) => s + (m.xp || 0), 0)
    + conq.reduce((s, q) => s + RARIDADES[q.rar][1], 0)
    + evAno.reduce((s, e) => s + Math.min(60, Math.floor(e.pag / 2)) + Math.min(30, Math.floor(e.horas * 3)), 0);
  const maxPor = (arr, f) => arr.filter(x => f(x) != null).sort((a, b) => f(b) - f(a))[0] || null;
  return {
    plats, zerados, lidos, dias, maior, porMes, melhorMes, missoes, conq, xp,
    paginas: lidos.reduce((s, l) => s + (l.totalPaginas || 0), 0),
    pagReg: evAno.reduce((s, e) => s + e.pag, 0), horasReg: Math.round(evAno.reduce((s, e) => s + e.horas, 0) * 10) / 10,
    desde: dias[0] || '',
    platDificil: maxPor(plats, j => j.dificuldade), platLonga: maxPor(plats, j => j.horasJogadas || null),
    livroLongo: maxPor(lidos, l => l.totalPaginas), livroTop: maxPor(lidos, l => l.avaliacao),
    notaMedia: lidos.filter(l => l.avaliacao).length ? Math.round(lidos.filter(l => l.avaliacao).reduce((s, l) => s + l.avaliacao, 0) / lidos.filter(l => l.avaliacao).length * 10) / 10 : null,
    metaPlat: c.metaPlatinas, metaLiv: c.metaLivros
  };
}
function fraseRetro(r) {
  const tot = r.plats.length + r.zerados.length + r.lidos.length;
  const bateu = (r.metaPlat > 0 && r.plats.length >= r.metaPlat) && (r.metaLiv > 0 && r.lidos.length >= r.metaLiv);
  if (bateu) return 'Temporada completa: as duas metas batidas. Lendário.';
  if (tot >= 12) return 'Um ano de muita estrada. O backlog sentiu.';
  if (tot >= 5) return 'Constância venceu. Cada conclusão contou.';
  if (tot > 0) return 'Começo de jornada. O próximo ano é seu.';
  return 'Ainda sem conclusões neste ano — a primeira está logo ali.';
}

function salvarFormJogo(form, j, novo) {
  const f = Object.fromEntries(new FormData(form));
  const nome = (f.nome || '').trim();
  if (!nome) { toast('Informe o nome do jogo.', 'erro'); form.elements.nome.focus(); return; }
  const statusAnt = novo ? null : j.status, antes = jogador();
  const horasAnt = novo ? 0 : (j.horasJogadas || 0), progAnt = novo ? 0 : (j.progresso || 0);
  Object.assign(j, {
    nome, plataforma: f.plataforma, status: f.status, meta: f.meta, prioridade: f.prioridade, online: f.online,
    dificuldade: limitar(num(f.dificuldade), 1, 10),
    horasEstimadas: positivo(num(f.horasEstimadas)),
    horasJogadas: positivo(num(f.horasJogadas)) ?? 0,
    progresso: limitar(num(f.progresso), 0, 100) ?? 0,
    inicio: f.inicio || '', conclusao: f.conclusao || '', notas: (f.notas || '').trim()
  });
  j.estDif = !!f.estDif && j.dificuldade != null;
  j.estHoras = !!f.estHoras && j.horasEstimadas != null;
  if (j.status === 'Platinado/100%') j.progresso = 100;
  if (j.status === 'Jogando' && !j.inicio) j.inicio = hoje();
  if (CONCLUIDO.includes(j.status) && !j.conclusao) j.conclusao = hoje();
  if (!novo) {
    registrarHoras(Math.round(((j.horasJogadas || 0) - horasAnt) * 10) / 10);
    if ((j.progresso || 0) !== progAnt || j.status !== statusAnt) registrar('atual', 1);
  }
  if (CONCLUIDO.includes(j.status) && !CONCLUIDO.includes(statusAnt)) marcarConclusao(j, j.conclusao === hoje());
  // Duplicados
  const outro = f.duplicadoDe ? acharJogo(f.duplicadoDe) : null;
  if (outro) {
    if (!outro.grupo) outro.grupo = (j.grupo && !state.jogos.some(x => x.grupo === j.grupo && x.id !== j.id)) ? j.grupo : uid();
    j.grupo = outro.grupo;
    if (f.versaoEscolhida) state.jogos.forEach(x => { if (x.grupo === j.grupo) x.versaoEscolhida = false; });
    j.versaoEscolhida = !!f.versaoEscolhida;
  } else { j.grupo = null; j.versaoEscolhida = false; }
  if (novo) state.jogos.push(j);
  limparGrupos();
  salvar(); fecharSheet(); render();
  toast(novo ? 'Jogo adicionado.' : 'Alterações salvas.');
  avisarFoco(statusAnt, j.status);
  celebrar(antes, jogador(), motivoJogo(j, statusAnt));
}

/* ---------- Sugerir próximo jogo ---------- */
let sugestao = { lista: [], idx: 0, querFacil: null, ultimo: null };
function calcularSugestao() {
  // Último jogo concluído (com dificuldade registrada) define a alternância
  const concl = state.jogos.filter(j => CONCLUIDO.includes(j.status) && j.conclusao && j.dificuldade != null)
    .sort((a, b) => b.conclusao.localeCompare(a.conclusao));
  const ultimo = concl[0] || null;
  const querFacil = ultimo ? ultimo.dificuldade >= 6 : null;
  const fila = state.jogos.filter(j => {
    if (j.status !== 'Na fila') return false;
    // Em duplicados, ignora a versão que não foi escolhida
    if (j.grupo) { const esc = state.jogos.find(x => x.grupo === j.grupo && x.versaoEscolhida); if (esc && esc.id !== j.id) return false; }
    return true;
  });
  const pontos = j => {
    const d = j.dificuldade ?? 5;
    let s = PRI_IDX[j.prioridade] * 100; // prioridade manda
    if (querFacil === true) s += d * 6; else if (querFacil === false) s += (10 - d) * 6; else s += d * 3;
    if (j.online === ONLINE[2] && j.meta !== 'Só zerar') s += 60;
    return s + (j.horasEstimadas ?? 50) / 25;
  };
  return { lista: fila.sort((a, b) => pontos(a) - pontos(b)), idx: 0, querFacil, ultimo };
}
function mostrarSugestao() {
  if (!sugestao.lista.length) {
    abrirSheet('Próximo alvo', '<div class="vazio">Nenhum jogo “Na fila”. Adicione jogos ou mude algum status para “Na fila”.</div>'); return;
  }
  const j = sugestao.lista[sugestao.idx % sugestao.lista.length], u = sugestao.ultimo, d = j.dificuldade;
  let motivo = `Prioridade ${j.prioridade.toLowerCase()}.`;
  if (u && sugestao.querFacil && d != null && d <= 5) motivo += ` O último concluído (${u.nome}, dif. ${u.dificuldade}) foi pesado — este é mais tranquilo.`;
  else if (u && sugestao.querFacil === false && d != null && d >= 6) motivo += ` O último concluído (${u.nome}, dif. ${u.dificuldade}) foi leve — hora de um desafio.`;
  else if (!u) motivo += ' Ainda não há jogo concluído com dificuldade registrada, então começo pelos mais acessíveis.';
  if (j.online === ONLINE[1]) motivo += ' Atenção: tem troféus online — confira se os servidores estão ativos.';
  const total = sugestao.lista.length, pos = sugestao.idx % total + 1;
  abrirSheet('Próximo alvo', `
    <p class="rot-mag" style="margin:0 0 10px">Missão recomendada</p>
    <div class="sugestao">${capaJogo(j)}
      <div><h3 style="font-size:17px">${esc(j.nome)}</h3><div class="info" style="margin-top:6px">
        ${d != null ? `<span>Dif. ${d}/10</span>` : ''}${j.horasEstimadas != null ? `<span>~${j.horasEstimadas} h</span>` : ''}<span class="prio-${j.prioridade}">${j.prioridade}</span></div>
        <div class="xp" style="margin-top:4px">vale ${xpAlvoJogo(j)} XP</div></div></div>
    <p class="motivo">${esc(motivo)}</p>
    <div class="acoes-linha"><button class="btn pri" data-acao="sug-comecar" data-id="${j.id}">Aceitar e começar</button>
      <button class="btn" data-acao="sug-outra">Outra sugestão (${pos}/${total})</button></div>`);
}

/* ---------- Importação por texto ---------- */
// Limpa uma linha colada: remove marcadores de lista e espaços extras
const limparLinha = l => l.replace(/^\s*(?:[-*•·]|\d+[.)\-:]?)\s+/, '').replace(/\s+/g, ' ').trim();
function analisarImportacao(texto, plataforma) {
  const vistos = new Set(), novos = [], existentes = [], outraPlat = [];
  let repetidos = 0;
  texto.split(/\r?\n/).map(limparLinha).filter(Boolean).forEach(nome => {
    const k = norm(nome);
    if (!k) return;
    if (vistos.has(k)) { repetidos++; return; }
    vistos.add(k);
    const iguais = state.jogos.filter(j => norm(j.nome) === k);
    if (iguais.some(j => j.plataforma === plataforma)) existentes.push(nome);
    else { novos.push(nome); if (iguais.length) outraPlat.push(nome); }
  });
  return { novos, existentes, outraPlat, repetidos };
}
function abrirImportacao() {
  abrirSheet('Colar lista de jogos', `<div class="form">
    <p class="ajuda">Cole um jogo por linha (ex.: da sua biblioteca Steam ou PSN). Linhas vazias e marcadores como “1.” ou “-” são ignorados.</p>
    <textarea id="impTexto" rows="9" placeholder="Hades&#10;Hollow Knight&#10;Celeste"></textarea>
    <div class="g2">${campo('Plataforma', sel('impPlat', PLATAFORMAS, 'Steam'))}${campo('Status padrão', sel('impStatus', STATUS_JOGO, 'Na fila'))}</div>
    <div class="g2">${campo('Meta padrão', sel('impMeta', METAS, '100% conquistas'))}${campo('Prioridade', sel('impPri', PRIORIDADES, 'Média'))}</div>
    <div class="resumo" id="impResumo">Cole a lista acima.</div>
    <button class="btn pri cheio" data-acao="confirmar-importacao" id="btnImportar" disabled>Importar</button>
  </div>`, c => {
    const atualizar = () => {
      const r = analisarImportacao($('#impTexto', c).value, $('#impPlat', c).value);
      const partes = [];
      if (r.novos.length) partes.push(`<b>${r.novos.length}</b> jogo(s) novo(s)`);
      if (r.existentes.length) partes.push(`<b>${r.existentes.length}</b> já existe(m) nessa plataforma e será(ão) ignorado(s): ${esc(r.existentes.slice(0, 8).join(', '))}${r.existentes.length > 8 ? '…' : ''}`);
      if (r.outraPlat.length) partes.push(`${r.outraPlat.length} também existe(m) em outra plataforma (dá para marcar como duplicado depois)`);
      if (r.repetidos) partes.push(`${r.repetidos} linha(s) repetida(s) na lista`);
      $('#impResumo', c).innerHTML = partes.length ? partes.join('<br>') : 'Cole a lista acima.';
      $('#btnImportar', c).disabled = !r.novos.length;
      $('#btnImportar', c).textContent = r.novos.length ? `Importar ${r.novos.length} jogo(s)` : 'Importar';
    };
    $('#impTexto', c).addEventListener('input', atualizar);
    $('#impPlat', c).addEventListener('change', () => { $('#impMeta', c).value = $('#impPlat', c).value === 'Steam' ? '100% conquistas' : 'Platinar'; atualizar(); });
  });
}
function confirmarImportacao() {

function capaLivro(l, extra = '', estilo = '') {

// Procura capas pelo título/autor: Google Books primeiro, Open Library de reserva.
// Devolve uma lista de endereços de imagem (pode vir vazia). Lança erro se não houver conexão/limite.
async function procurarCapasLivro(titulo, autor) {
  const urls = [];
  const pegar = async url => { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
  const google = async q => {
    const d = await pegar(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=10&printType=books`);
    (d.items || []).forEach(i => {
      const im = i.volumeInfo && i.volumeInfo.imageLinks;
      const u = im && (im.thumbnail || im.smallThumbnail);
      if (u) urls.push(u.replace(/^http:/, 'https:').replace('&edge=curl', ''));
    });
  };
  const openLibrary = async a => {
    const d = await pegar(`https://openlibrary.org/search.json?title=${encodeURIComponent(titulo)}${a ? `&author=${encodeURIComponent(a)}` : ''}&fields=cover_i&limit=10`);
    (d.docs || []).forEach(x => { if (x.cover_i) urls.push(`https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg`); });
  };
  // Cada fonte pode falhar sozinha (o Google às vezes limita pedidos); só desiste se as duas falharem
  let falhas = 0;
  try {
    await google(`intitle:${titulo}${autor ? ` inauthor:${autor}` : ''}`);
    if (!urls.length && autor) await google(`intitle:${titulo}`);
  } catch (e) { falhas++; }
  try {
    const antes = urls.length;
    await openLibrary(autor);
    if (urls.length === antes && autor) await openLibrary('');
  } catch (e) { falhas++; }
  // Nada achado com alguma fonte fora do ar: melhor tentar de novo mais tarde
  if (falhas && !urls.length) throw new Error('tentar depois');
  return [...new Set(urls)];
}
function atualizarCapaNaTela(l) {
  $$(`[data-capa-livro="${l.id}"]`).forEach(el => { el.outerHTML = capaLivro(l, el.dataset.extra || '', el.getAttribute('style') || ''); });
}
// Busca, em segundo plano, a capa dos livros que ainda não têm (uma vez por livro)
let buscandoCapas = false, capasLiberadas = false; // liberadas só depois do login/1ª sincronização
const falhouCapa = new Map(); // livro → hora da última tentativa que falhou
async function buscarCapasLivros() {
  if (!capasLiberadas || buscandoCapas || !navigator.onLine || state.semente) return;
  if (nuvem.ativo && (!nuvem.usuario || !nuvem.ultimaSync)) return;
  const fila = state.livros.filter(l => !l.capa && !l.capaBuscada && l.titulo && !(Date.now() - (falhouCapa.get(l.id) || 0) < 600000));
  if (!fila.length) return;
  buscandoCapas = true;
  let mudou = false;
  try {
    for (const x of fila) {
      let urls;
      try { urls = await procurarCapasLivro(x.titulo, x.autor); }
      catch (e) { falhouCapa.set(x.id, Date.now()); continue; } // sem rede ou limite: tenta em 10 min
      const l = acharLivro(x.id);
      if (!l || l.titulo !== x.titulo || l.capaBuscada) continue;
      l.capaBuscada = true; mudou = true;
      if (urls[0]) { l.capa = urls[0]; atualizarCapaNaTela(l); }
    }
  } finally { buscandoCapas = false; }
  if (mudou) salvar();
}
function cardLivro(l) {

/* ---------- Reordenação (arrastar + botões) ---------- */
function aplicarOrdem(ids, movidoId) {
  ids.forEach((id, i) => { const l = acharLivro(id); if (l) l.ordem = i + 1; });
  // Livros fora da fila (lidos/abandonados) ficam depois
  let n = ids.length;
  state.livros.filter(l => !ids.includes(l.id)).sort((a, b) => (a.ordem || 0) - (b.ordem || 0)).forEach(l => { l.ordem = ++n; });
  const m = acharLivro(movidoId); if (m) m.semPosicao = false;
  salvar();
}
function moverLivro(id, delta) {
  const ids = listaOrdem().map(l => l.id), i = ids.indexOf(id), k = i + delta;
  if (i < 0 || k < 0 || k >= ids.length) return;
  [ids[i], ids[k]] = [ids[k], ids[i]];
  aplicarOrdem(ids, id); renderAreaLivros();
}
function moverParaPosicao(id, pos) {
  const ids = listaOrdem().map(l => l.id).filter(x => x !== id);
  ids.splice(Math.max(0, Math.min(ids.length, pos - 1)), 0, id);
  aplicarOrdem(ids, id);
}
// Arrastar com Pointer Events (funciona com dedo e mouse)
function ligarArraste() {
  const lista = $('#listaOrdem'); if (!lista) return;
  lista.addEventListener('pointerdown', ev => {
    const alca = ev.target.closest('[data-alca]'); if (!alca) return;
    const item = alca.closest('.ordem-item');
    ev.preventDefault();
    lista.classList.add('em-arraste'); item.classList.add('arrastando');
    const mover = e => {
      const y = e.clientY;
      const irmaos = $$('.ordem-item', lista).filter(x => x !== item);
      const antes = irmaos.find(s => { const r = s.getBoundingClientRect(); return y < r.top + r.height / 2; });
      if (antes) { if (antes.previousElementSibling !== item) lista.insertBefore(item, antes); }
      else if (lista.lastElementChild !== item) lista.appendChild(item);
      // Rolagem automática perto das bordas
      if (y < 90) window.scrollBy(0, -12); else if (y > window.innerHeight - 140) window.scrollBy(0, 12);
    };
    // Ouve no documento inteiro: mover o item no DOM cancela a captura do ponteiro
    const soltar = () => {
      document.removeEventListener('pointermove', mover);
      document.removeEventListener('pointerup', soltar);
      document.removeEventListener('pointercancel', soltar);
      const ids = $$('.ordem-item', lista).map(x => x.dataset.id);
      aplicarOrdem(ids, item.dataset.id);
      renderAreaLivros();
    };
    document.addEventListener('pointermove', mover);
    document.addEventListener('pointerup', soltar);
    document.addEventListener('pointercancel', soltar);
  });
}

/* ---------- Status, página e avaliação de livros ---------- */
function aplicarStatusLivro(l, novo) {
  const ant = l.status;
  l.status = novo;
  if (novo === 'Lendo' && !l.inicio) l.inicio = hoje();
  if (novo !== ant) registrar('atual', 1);
  if (novo === 'Lido' && ant !== 'Lido') { l.fim = hoje(); if (l.totalPaginas) l.paginaAtual = l.totalPaginas; registrar('concl', 1); }
  if ((novo === 'Lendo' || novo === 'Na fila') && !['Lendo', 'Na fila'].includes(ant)) l.ordem = maxOrdem() + 1;
  return ant !== 'Lido' && novo === 'Lido';
}
function abrirAvaliacao(l) {

function salvarPagina(id) {
  const l = acharLivro(id); if (!l) return;

  if (l.totalPaginas && l.paginaAtual > l.totalPaginas) l.paginaAtual = l.totalPaginas;
  registrarPaginas(l.paginaAtual - pagAnt);
  if (!l.inicio) l.inicio = hoje();
  salvar();
  if (l.totalPaginas && l.paginaAtual >= l.totalPaginas && l.status !== 'Lido' && confirm(`Você chegou ao fim de “${l.titulo}”. Marcar como lido?`)) {
    aplicarStatusLivro(l, 'Lido'); salvar(); render();
    celebrar(antes, jogador(), { tipo: 'livro', item: l }, () => abrirAvaliacao(l)); return;

function salvarFormLivro(form, l, novo, posAtual) {
  const f = Object.fromEntries(new FormData(form));
  const titulo = (f.titulo || '').trim();
  if (!titulo) { toast('Informe o título do livro.', 'erro'); form.elements.titulo.focus(); return; }
  const ant = novo ? null : l.status, pagAnt = novo ? 0 : (l.paginaAtual || 0), antes = jogador();
  // Capa escolhida à mão vale; se mudou título/autor sem escolher, busca de novo sozinho
  if (f.capaMexeu === '1') { l.capa = f.capa || ''; l.capaBuscada = true; }
  else if (novo || titulo !== l.titulo || (f.autor || '').trim() !== l.autor) { l.capa = ''; l.capaBuscada = false; }
  Object.assign(l, {
    titulo, autor: (f.autor || '').trim(), categoria: f.categoria, dificuldade: f.dificuldade, formato: f.formato,
    totalPaginas: num(f.totalPaginas) > 0 ? Math.round(num(f.totalPaginas)) : null,
    paginaAtual: Math.round(positivo(num(f.paginaAtual)) ?? 0),
    inicio: f.inicio || '', fim: f.fim || '', avaliacao: num(f.avaliacao), notas: (f.notas || '').trim()
  });
  // Status (com datas automáticas e entrada na fila)
  l.status = ant ?? 'Na fila';
  if (novo) { l.ordem = maxOrdem() + 1; state.livros.push(l); }
  const virouLido = aplicarStatusLivro(l, f.status);
  if (f.fim) l.fim = f.fim; // respeita data informada manualmente
  if (!novo && !virouLido) registrarPaginas(l.paginaAtual - pagAnt);
  if (l.totalPaginas && l.paginaAtual > l.totalPaginas) l.paginaAtual = l.totalPaginas;
  // Posição na ordem de leitura
  const pos = num(f.posicao);
  if (['Lendo', 'Na fila'].includes(l.status) && pos && pos !== posAtual) moverParaPosicao(l.id, Math.round(pos));
  salvar(); fecharSheet(); render();
  if (!virouLido) toast(novo ? 'Livro adicionado.' : 'Alterações salvas.');
  celebrar(antes, jogador(), virouLido ? { tipo: 'livro', item: l } : null, virouLido && !l.avaliacao ? () => abrirAvaliacao(l) : null);
}
function excluirLivro(id) {
  const l = acharLivro(id); if (!l) return;
  if (!confirm(`Excluir “${l.titulo}”? Essa ação não pode ser desfeita.`)) return;
  state.livros = state.livros.filter(x => x.id !== id);
  salvar(); fecharSheet(); render(); toast('Livro excluído.');
}
